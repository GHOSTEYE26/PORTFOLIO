<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0ff;
      background: transparent;
      line-height: 1.6;
    }

    .contact-container {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      color: #00f0ff;
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.3rem;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .contact-content {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 40px;
      align-items: start;
    }

    .contact-info {
      background: rgba(255,255,255,0.06);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .info-item i {
      font-size: 1.8rem;
      color: #00f0ff;
      width: 45px;
    }

    .info-item h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .info-item p {
      margin: 4px 0 0 0;
      color: #b0b0ff;
    }

    .contact-form {
      background: rgba(255,255,255,0.06);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #00f0ff;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    .submit-btn {
      background: linear-gradient(90deg, #00f0ff, #0099cc);
      color: #000;
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.4);
    }

    .social-links {
      margin-top: 30px;
      text-align: center;
    }

    .social-links a {
      color: #00f0ff;
      font-size: 1.8rem;
      margin: 0 12px;
      transition: 0.3s;
    }

    .social-links a:hover {
      color: #ff00ff;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <h2>Get In Touch</h2>

    <div class="contact-content">

      <!-- Contact Info -->
      <div class="contact-info">
        <h3 style="margin-bottom: 25px; color:#fff;">Contact Information</h3>
        
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <div>
            <h3>Email</h3>
            <p>rounakchouhan187@gmail.com</p>
          </div>
        </div>

        <div class="info-item">
          <i class="fas fa-phone"></i>
          <div>
            <h3>Phone</h3>
            <p>+91 7878327980</p>
          </div>
        </div>

        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <div>
            <h3>Location</h3>
            <p>Ajmer, Rajasthan, India</p>
          </div>
        </div>

        <div class="social-links">
          <a href="https://www.linkedin.com/in/rounak-chouhan-3b4145309/" target="_blank"><i class="fab fa-linkedin"></i></a>
          <a href="https://github.com/GHOSTEYE26" target="_blank"><i class="fab fa-github"></i></a>
          <a href="https://www.instagram.com/rounak_chouhan26?igsh=MXVnOXgxeWlpYm8zbQ==" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form">
        <h3 style="margin-bottom: 20px; color:#fff;">Send a Message</h3>
        
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" name="name" required>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
          </div>

          <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" required>
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea name="message" required placeholder="Write your message here..."></textarea>
          </div>

          <button type="submit" class="submit-btn">
            Send Message <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
