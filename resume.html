<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      color: #e0e0ff;
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .resume-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .resume-header {
      background: rgba(0, 240, 255, 0.1);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }

    .resume-header h2 {
      margin: 0;
      color: #00f0ff;
      font-size: 1.5rem;
    }

    .download-btn {
      background: linear-gradient(90deg, #00f0ff, #0099cc);
      color: #000;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    .pdf-viewer {
      flex: 1;
      padding: 10px;
      background: #0a0a1f;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    embed, iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      background: #fff;
    }

    .no-pdf {
      text-align: center;
      color: #888;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="resume-container">

    <div class="resume-header">
      <h2><i class="fas fa-file-pdf"></i> Resume</h2>
    </div>

    <div class="pdf-viewer">
      <!-- Replace 'Rounak_Chouhan_Resume.pdf' with your actual PDF file name -->
      <embed 
        src="images/Simple_Hipster_CV.pdf" 
        type="application/pdf" 
        width="100%" 
        height="100%">
      
      <!-- Fallback message if PDF doesn't load -->
      <div class="no-pdf" style="display:none;">
        <p>Unable to display PDF.</p>
        <button onclick="downloadResume()" style="padding:12px 24px; margin-top:15px;">
          Download Resume PDF
        </button>
      </div>
    </div>

  </div>

  <script>
    function downloadResume() {
      const link = document.createElement('a');
      link.href = "images/Simple_Hipster_CV.pdf";   // ← Change this to your actual PDF filename
      link.download = "images/Simple_Hipster_CV.pdf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Optional: Show fallback message if PDF fails to load
    window.onload = function() {
      const embed = document.querySelector('embed');
      embed.onerror = function() {
        this.style.display = 'none';
        document.querySelector('.no-pdf').style.display = 'block';
      };
    };
  </script>

</body>
</html>
